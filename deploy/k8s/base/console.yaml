apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app.kubernetes.io/name: traceforge-console }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: traceforge-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: traceforge-console }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: ghcr.io/victorodoyo/traceforge-console:latest
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  selector: { app.kubernetes.io/name: traceforge-console }
  ports:
    - { name: http, port: 80, targetPort: http }
