apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: traceforge-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: traceforge-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: traceforge-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/victorodoyo/traceforge-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: traceforge-config }
          env:
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef: { name: clickhouse-credentials, key: dsn }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app.kubernetes.io/name: traceforge-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
