apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clickhouse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clickhouse }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8-alpine
          env:
            - name: CLICKHOUSE_DB
              value: traceforge
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: { name: clickhouse-credentials, key: username }
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: clickhouse-credentials, key: password }
          ports:
            - { name: native, containerPort: 9000 }
            - { name: http, containerPort: 8123 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: clickhouse }
  ports:
    - { name: native, port: 9000 }
    - { name: http, port: 8123 }
