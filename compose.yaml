name: traceforge

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: traceforge
      CLICKHOUSE_USER: traceforge
      CLICKHOUSE_PASSWORD: traceforge
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      clickhouse:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      CLICKHOUSE_DSN: clickhouse://traceforge:traceforge@clickhouse:9000/traceforge
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy
      collector:
        condition: service_started

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports:
      - "4173:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - collector

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: traceforge
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  clickhouse-data:
  prometheus-data:
  grafana-data:
